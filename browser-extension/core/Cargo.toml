[package]
name = "ifs-capture-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Capture core of the IFS Agent Ops browser extension: CDP network events -> ordered capture events"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"
# Must match the installed wasm-bindgen CLI exactly (see ../build.ps1).
wasm-bindgen = { version = "=0.2.100", optional = true }

[features]
wasm = ["dep:wasm-bindgen"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
